<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETiquetas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Estilos da Interface do Editor */
        /* Estilos base para as páginas de etiquetas (A4) */
        .a4-page {
            width: 210mm;
            height: 297mm;
            margin: 0;
            padding: 0;
            /* Ajustado para controle total via grid */
            box-sizing: border-box;
            background: white;
            position: relative;
            overflow: hidden;
            display: block;
            page-break-after: always;
        }

        /* Grid específico para Pimaco 365 (8 etiquetas: 2x4) */
        .pimaco-365-grid {
            display: grid;
            grid-template-columns: 99mm 99mm;
            grid-template-rows: 67.7mm 67.7mm 67.7mm 67.7mm;
            column-gap: 0;
            row-gap: 0;
            justify-content: center;
            align-content: center;
            height: 297mm;
            width: 210mm;
        }

        .label-print-wrapper {
            page-break-inside: avoid;
            break-inside: avoid;
        }

        .print-only {
            display: none !important;
        }

        @media print {
            @page {
                size: A4 portrait;
                margin: 0mm !important;
            }

            html,
            body {
                width: 210mm;
                height: 297mm;
                margin: 0 !important;
                padding: 0 !important;
                background: white !important;
                print-color-adjust: exact !important;
                -webkit-print-color-adjust: exact !important;
            }

            .no-print {
                display: none !important;
            }

            .print-only {
                display: block !important;
                width: 210mm;
                margin: 0 auto;
            }
        }

        .preview-shadow {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }

        .label-container {
            border: 0.25mm dashed #94a3b8 !important;
            box-sizing: border-box !important;
        }

        @media screen {
            .label-container {
                border-width: 1px !important;
            }
        }
    </style>
